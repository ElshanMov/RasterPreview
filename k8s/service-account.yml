apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-ui-role
  namespace: ${NAMESPACE}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-ui-role-binding
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: pipeline-ui
  namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: pipeline-ui-role
  apiGroup: rbac.authorization.k8s.io